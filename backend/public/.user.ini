; PHP configuration overrides for media uploads
; This file is read by PHP-FPM and applies settings for this directory

; Maximum POST size (must be >= upload_max_filesize)
; Set to 4.5 GB to accommodate 4 GB video + 512 MB overhead
post_max_size = 4608M

; Maximum upload file size
; Set to 4 GB for large video uploads
upload_max_filesize = 4096M

; Maximum execution time for script (seconds)
; Increased to 3600 (1 hour) for large file processing
max_execution_time = 3600

; Maximum time to read input (seconds)
; Increased to 3600 (1 hour) for chunked uploads
max_input_time = 3600

; Memory limit per request
; Set to 512 MB for handling chunked uploads
memory_limit = 512M

; Default charset
default_charset = UTF-8
